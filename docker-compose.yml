version: '3.8'

services:
  control-center:
    build:
      context: .
      dockerfile: Dockerfile
    image: foxai-control-center:latest
    container_name: foxai-control-center
    restart: unless-stopped

    # Resource limits - adjust based on your VPS
    deploy:
      resources:
        limits:
          # Memory limit - prevents OOM
          memory: 256M
          # CPU limit - use 0.5 cores max
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

    # Environment variables
    environment:
      - NODE_ENV=production
      - UI_MODE=true
      - UI_PORT=4310
      - GATEWAY_URL=ws://host.docker.internal:18789
      - OPENCLAW_HOME=/root/.openclaw
      - OPENCLAW_CONFIG_PATH=/root/.openclaw/openclaw.json
      - READONLY_MODE=${READONLY_MODE:-true}
      - LOCAL_TOKEN_AUTH_REQUIRED=${LOCAL_TOKEN_AUTH_REQUIRED:-true}
      - LOCAL_API_TOKEN=${LOCAL_API_TOKEN:-}
      - TASK_HEARTBEAT_ENABLED=${TASK_HEARTBEAT_ENABLED:-true}
      - TASK_HEARTBEAT_DRY_RUN=${TASK_HEARTBEAT_DRY_RUN:-true}
      - MONITOR_CONTINUOUS=${MONITOR_CONTINUOUS:-false}

      # Optimized polling intervals (longer = less CPU/network)
      - POLLING_INTERVALS_MS=${POLLING_INTERVALS_MS:-sessionsList=15000,sessionStatus=5000,cron=30000,approvals=5000,canvas=10000}

    # Network configuration
    ports:
      - "4310:4310"

    # Volume for runtime data persistence and OpenClaw access
    volumes:
      - ./runtime:/app/runtime:rw
      - ./runtime/openclaw_data:/root/.openclaw:rw
      - /usr/lib/node_modules/openclaw:/usr/lib/node_modules/openclaw:ro
      - /usr/bin/openclaw:/usr/local/bin/openclaw:ro

    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: false  # Need write for runtime data

    # Logging - limited size
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

    # Health check - disabled due to localhost binding issues
    healthcheck:
      disable: true

# Networks
networks:
  default:
    driver: bridge
